# Dependabot configuration
# Runs once a month on day 13 at 03:20 (Europe/Berlin timezone) using a cron schedule.
# The cooldown delays normal npm dependency updates by 7 days to reduce supply chain risk,
# while security updates are still processed immediately.
# Note: Cooldown is not supported for the github-actions ecosystem.
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: cron
      timezone: 'Europe/Berlin'
      cronjob: '20 3 13 * *'
    open-pull-requests-limit: 15
    assignees:
      - sg-app
    versioning-strategy: increase
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: cron
      timezone: 'Europe/Berlin'
      cronjob: '20 3 13 * *'
    open-pull-requests-limit: 15
    assignees:
      - sg-app
